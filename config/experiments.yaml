# Batch definitions consumed by scripts/run_batch.py.
# Each entry is a SystemParams / ControllerParams / PerturbationSpec dict.
experiments:
  - name: n1_pid_5deg
    system:
      N: 1
      explicit_theta_deg: [5.0]
      sim_time: 20.0
    controller:
      type: pid
      kp: 80.0
      ki: 4.0
      kd: 40.0
      kp_cart: 3.0
      kd_cart: 8.0
    perturbations: []

  - name: n3_lqr_1deg
    system:
      N: 3
      explicit_theta_deg: [1.0, 0.0, 0.0]
      sim_time: 20.0
    controller:
      type: lqr
    perturbations: []

  - name: n20_vertical_equilibrium
    system:
      N: 20
      initial_condition: vertical
      sim_time: 1.0
    controller:
      type: none
    perturbations: []
