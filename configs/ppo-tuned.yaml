behaviors:
  StickBalancingN1:
    trainer_type: ppo
    hyperparameters:
      batch_size: 128
      buffer_size: 512
      learning_rate: 0.0003
      beta: 0.05
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    max_steps: 2048
    time_horizon: 64
    summary_freq: 256
    checkpoint_interval: 512
    keep_checkpoints: 5
env_settings:
  num_envs: 1
  seed: 42
engine_settings:
  time_scale: 20
  no_graphics: true
  capture_frame_rate: 0
torch_settings:
  device: cpu